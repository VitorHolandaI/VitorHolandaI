<svg fill="none" viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .wall {
          width: 800px;
          height: 400px;
          display: flex;
          flex-wrap: wrap;
          gap: 4px;
          align-content: flex-start;
          overflow: hidden;
          background: #030712;
        }

        .loading__anim {
          width: 26px;
          height: 26px;
          box-sizing: border-box;
          display: inline-block;
          border: 3px solid rgba(0, 255, 189, 0.18);
          border-left-color: rgba(3, 255, 229, 0.95);
          border-top-color: rgba(3, 55, 229, 0.95);
          animation: rotate 16000ms infinite linear;
          will-change: transform;
        }

        .loading__anim:nth-child(4n) {
          border-left-color: rgba(134, 239, 172, 0.95);
          border-top-color: rgba(34, 211, 238, 0.95);
          animation-duration: 22000ms;
        }

        .loading__anim:nth-child(4n + 1) {
          border-left-color: rgba(250, 204, 21, 0.95);
          border-top-color: rgba(168, 85, 247, 0.9);
          animation-duration: 19000ms;
          animation-direction: reverse;
        }

        .loading__anim:nth-child(4n + 2) {
          border-left-color: rgba(96, 165, 250, 0.95);
          border-top-color: rgba(45, 212, 191, 0.95);
          animation-duration: 13000ms;
        }

        .loading__anim:nth-child(7n) {
          opacity: 0.55;
          transform: scale(0.82);
        }

        .loading__anim:nth-child(11n) {
          opacity: 0.82;
          border-radius: 4px;
        }

        @keyframes rotate {
          to {
            transform: rotate(1turn);
          }
        }
      </style>

      <div class="wall">
        <span class="loading__anim"></span><span class="loading__anim"></span><span class="loading__anim"></span><span class="loading__anim"></span><span class="loading__anim"></span><span class="loading__anim"></span><span class="loading__anim"></span><span class="loading__anim"></span><span class="loading__anim"></span><span class="loading__anim"></span>
